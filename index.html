<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        header {
            background-color: aquamarine;
            color: darkblue;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            border: 4px solid yellow;
            padding: 2px;
        }
        main{
            background-color: black;
            color: beige;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            p.autor {
                font-weight: bold;
            }
        }
        img {
            width: 80px;
            height: 80px;
        }
    </style>
</head>
<body>
    <header>
            <h1>Trabalho 1 B</h1>
            <p>Aprenda a produzir um site</p>
    </header>
    <main>
        <img src="imagem.png" alt="imagem da aula de educação digital">
        <div>
            <h2>Exercício de aula do 1 B</h2>
            <p class="autor">Por: Michel Rissonio</p>
            <p>Este site é um exercício da aula de educação digital</p>
            <button>🔥<span>0</span></button>
        </div>
    </main>
</body>
<script>
    const botao = document.querySelector ("button");
    botao.addEventListener ("click", botaoClicado);
    function botaoClicado () {
        let texto = botao.querySelector ("span");
        texto.textContent++;
    }
</script>
</html>
